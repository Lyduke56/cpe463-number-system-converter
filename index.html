<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number System Converter & Calculator</title>
    <!-- Links to your external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Number System Converter & Calculator</h1>
        <p class="subtitle">Convert between Binary, Octal, Decimal, and Hexadecimal</p>

        <div class="control-panel">
            <label for="num-inputs"><strong>Number of Inputs (Min 3):</strong></label>
            <input type="number" id="num-inputs" min="3" value="3">
            <button id="generate-btn">Generate Fields</button>
        </div>

        <div id="inputs-container"></div>

        <div class="action-area">
            <button id="process-btn">Validate & Convert All</button>
        </div>
    </div>

    <!-- Links to your external JS file. Placed at the bottom so HTML loads first -->
    <script src="script.js"></script>
</body>
</html>
